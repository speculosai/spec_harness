name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Agent kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "py/speculos_harness[dev]"
      - name: Test
        run: pytest py/speculos_harness/tests -q

  examples:
    name: Examples compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile every example
        run: python -m compileall -q examples
