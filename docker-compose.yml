# Speculos Harness - the reference three-service stack.
#
#   web     -> the React workspace (<Builder>), talks to the agent over the wire protocol
#   agent   -> the mountable FastAPI router (the pip package speculos-harness)
#   bundler -> the build service: {files, deps} in, {code, css} out
#
# One command brings up a working builder at http://localhost:5173:
#
#   export ANTHROPIC_API_KEY=sk-ant-...   # any LiteLLM-supported provider works
#   docker compose up
#
# This root file is the same stack the quickstart runs from examples/minimal. To
# avoid two definitions drifting apart, it is a single include of that one file
# rather than a second copy - edit the topology there. Relative paths in the
# included file resolve against examples/minimal, so the build contexts still
# point at the repository root.

include:
  - examples/minimal/docker-compose.yml
