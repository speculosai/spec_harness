# Speculos Harness - the reference three-service stack.
#
#   web     -> the React workspace (<Builder>), talks to the agent over the wire protocol
#   agent   -> the mountable FastAPI router (the pip package speculos-harness)
#   bundler -> the build service: {files, deps} in, {code, css} out
#
# One command brings up a working builder at http://localhost:5173:
#
#   export ANTHROPIC_API_KEY=sk-ant-...   # any LiteLLM-supported provider works
#   docker compose up
#
# See examples/minimal for the web and backend sources these services build from.

services:
  bundler:
    # The locked-down build container: non-root, ephemeral build dir, installs
    # run with --ignore-scripts.
    build: ./packages/bundler
    image: speculos/harness-bundler
    # Build locally rather than pulling - the image is not on a registry yet.
    pull_policy: build
    ports:
      - "8081:8081"

  agent:
    # The Python agent kit mounted on a minimal FastAPI app.
    build:
      context: .
      dockerfile: examples/minimal/backend/Dockerfile
    environment:
      # One LLM key, read from your shell or a .env file. Never commit a real key.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-sk-ant-...}
      # Where the bundler sidecar lives, inside the compose network.
      - BUNDLER_URL=http://bundler:8081
    depends_on:
      - bundler
    ports:
      - "8000:8000"

  web:
    # The React workspace example. Points at the agent router (mounted at /api/builder).
    build:
      context: .
      dockerfile: examples/minimal/web/Dockerfile
    environment:
      - HARNESS_BASE_URL=http://agent:8000/api/builder
    depends_on:
      - agent
    ports:
      - "5173:5173"
