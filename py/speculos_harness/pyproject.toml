# pyproject.toml - speculos-harness (Python backend kit)
#
# The mountable FastAPI router and adapter interfaces for Speculos Harness:
# an embeddable AI app-building workspace. This is the production engine
# behind Speculos - one agent loop, in one language, on the revenue path.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speculos-harness"
version = "0.1.1"
description = "Embeddable AI app-building workspace - the mountable FastAPI agent router and adapter interfaces."
readme = "README.md"
requires-python = ">=3.11"
# SPDX expression plus the license files themselves, so the sdist and the wheel
# both carry the Apache-2.0 text and the NOTICE, as Apache-2.0 4(a)/(d) require
# of a redistribution. The files live next to this pyproject; they are copies of
# the repo-root LICENSE and NOTICE.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["ai", "agent", "code-generation", "fastapi", "sse", "llm", "app-builder"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

# Runtime dependencies.
#
#   fastapi   - the mounted router.
#   litellm   - the reference LLMProvider speaks whatever LiteLLM speaks
#               (Anthropic / OpenAI / Bedrock / open weights / a LiteLLM proxy).
#   httpx     - async client for the bundler sidecar and connector RPC.
#   pydantic  - wire models generated from the protocol JSON Schema.
dependencies = [
    "fastapi>=0.110",
    "litellm>=1.40",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.urls]
Homepage = "https://speculos.ai"
Repository = "https://github.com/speculosai/spec_harness"

[project.optional-dependencies]
# Reference adapters that pull extra drivers. Kept optional so the core boots
# with zero configuration and no surprise transitive installs.
postgres = [
    "psycopg[binary]>=3.1",
]
dev = [
    "pytest>=8.0",
    "anyio>=4.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["speculos_harness"]
# The PEP 561 marker: shipped explicitly so downstream type checkers honor the
# package's annotations and the "Typing :: Typed" classifier is truthful. The
# template UI kit is a real .tsx asset templates.py reads at import time, so it
# must ship in the wheel too or `import speculos_harness.templates` breaks.
artifacts = ["speculos_harness/py.typed", "speculos_harness/template_assets/*.tsx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
